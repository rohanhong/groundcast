# groundcast settings: copy to the per-user config file (path printed by
# `groundcast paths`) or point GROUNDCAST_CONFIG at your copy. Every key
# is optional; the values below are the defaults. Environment variables win
# over this file: GROUNDCAST_<SECTION>_<KEY>, for example
# GROUNDCAST_LLM_WRITER_MODEL=sonnet, or GROUNDCAST_DATA_DIR for top-level keys.
# Never put API keys here; the API backend reads the variable named by
# llm.api_key_env.

# Materials, chunks, sessions. Default: the per-user data directory of the OS.
# data_dir = "D:/groundcast-data"
# Downloaded model weights. Default: the per-user cache directory of the OS.
# model_dir = "D:/groundcast-models"

[server]
host = "127.0.0.1"  # loopback only
port = 8765

[launcher]
# `groundcast launch`, which the desktop shortcut runs.
window = "app"  # app: a window without tabs or address bar; browser: a tab in the default browser; none
# Browsers tried in order for the app window: a path (%VARS% and ~ are expanded) or a program name on PATH.
browsers = [
  '%ProgramFiles(x86)%\Microsoft\Edge\Application\msedge.exe',
  '%ProgramFiles%\Microsoft\Edge\Application\msedge.exe',
  '%ProgramFiles%\Google\Chrome\Application\chrome.exe',
  '%ProgramFiles(x86)%\Google\Chrome\Application\chrome.exe',
  '%LOCALAPPDATA%\Google\Chrome\Application\chrome.exe',
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome",
  "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge",
  "/Applications/Chromium.app/Contents/MacOS/Chromium",
  "microsoft-edge",
  "google-chrome",
  "google-chrome-stable",
  "chromium",
  "chromium-browser",
]
ready_timeout_s = 60.0
stop_when_closed = true  # stop once no page has been open for close_grace_s and no work is running
close_grace_s = 15.0
heartbeat_s = 20.0  # how often an open page checks in
page_timeout_s = 600.0  # a page silent this long counts as closed (a crashed or frozen tab)
shortcut_name = "groundcast"

[llm]
backend = "claude-cli"  # or "anthropic-api" (needs the "api" extra)
claude_bin = "claude"
api_key_env = "ANTHROPIC_API_KEY"
api_max_tokens = 32000
writer_model = "opus"
writer_effort = "high"
verifier_model = "sonnet"  # a different tier from the Writer
verifier_effort = "medium"
editor_model = "opus"
editor_effort = "medium"
elicitor_model = "sonnet"  # turns a rough request into a brief (S1)
elicitor_effort = "low"
tutor_model = "sonnet"  # answers typed questions about a session
tutor_effort = "medium"
concepts_model = "sonnet"  # extracts concepts from materials
concepts_effort = "medium"
quiz_model = "sonnet"  # writes multiple-choice quizzes
quiz_effort = "medium"
judge_model = "sonnet"  # scores scripts in `groundcast eval-quality`
judge_effort = "high"
timeout_s = 900
max_attempts = 3
retry_backoff_s = 10.0  # wait before retry n is n times this

[llm.api_models]
opus = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"
haiku = "claude-haiku-5-5"

[ingest]
pdftotext_bin = "pdftotext"
chunk_max_words = 180
slide_notes = true  # PowerPoint speaker notes join their slide's text
fetch_timeout_s = 30.0  # web pages added by address
fetch_max_bytes = 20000000
user_agent = "groundcast (local study tool)"

[asr]
# Speech recognition for video and audio (needs the "asr" extra).
engine = "faster-whisper"  # or "none"
model = "large-v3-turbo"  # downloaded into model_dir on first use
device = "auto"  # auto, cpu, or cuda
compute_type = "auto"  # float16 on the GPU, int8 on the CPU
beam_size = 5
vad_filter = true  # skip long silences and music
paragraph_gap_s = 2.0  # a pause this long starts a new passage
max_passage_s = 90.0
review_below = 0.8  # passages with a lower mean word probability are highlighted for review

[ocr]
# Text recognition for scans, photos, and handwriting (Tesseract, a separate
# program installed by environment.yml). Recognised text waits for your review.
engine = "tesseract"  # or "none"
tesseract_bin = "tesseract"
pdftoppm_bin = "pdftoppm"  # renders PDF pages for recognition
pdfimages_bin = "pdfimages"  # finds the scanned pages of a PDF
language = "eng"
tessdata_dir = ""  # another language data folder, for example tessdata_best
psm = 3  # page segmentation mode; 3 finds the layout
dpi = 300
min_page_chars = 10  # a PDF page with less text than this
min_image_pixels = 250000  # and an image at least this large is a scan, and is recognised
timeout_s = 300.0  # per page
review_below = 0.8  # paragraphs with a lower mean word confidence are highlighted for review

[pipeline]
words_per_minute = 125  # of finished audio at tts.speed 1.0; see the session log
pace_min_words = 150  # a voice's measured pace replaces words_per_minute after this many words
pace_decay = 0.7  # weight each new session keeps for the earlier ones
bm25_top_k = 4
retrieval_context = true  # add the line before a sentence to its retrieval query
verify_batch_size = 20
max_revise_rounds = 2
writer_max_source_words = 60000
recall_questions = 3  # when a brief asks for recall prompts
length_tolerance = 0.15  # drafts longer than the word target by more are shortened
max_trim_rounds = 2
unresolved = "drop"  # or "mark": keep and label as not verified

[tts]
engine = "kokoro"  # or "silent" for dry runs without a model
voice = "af_heart"
second_voice = "am_michael"  # Host B in two-host sessions
lang_code = "a"  # a: American English, b: British English
# Voices offered as preferences; only those starting with lang_code are shown.
voice_choices = [
  "af_heart",
  "af_alloy",
  "af_aoede",
  "af_bella",
  "af_jessica",
  "af_kore",
  "af_nicole",
  "af_nova",
  "af_river",
  "af_sarah",
  "af_sky",
  "am_adam",
  "am_echo",
  "am_eric",
  "am_fenrir",
  "am_liam",
  "am_michael",
  "am_onyx",
  "am_puck",
  "am_santa",
  "bf_alice",
  "bf_emma",
  "bf_isabella",
  "bf_lily",
  "bm_daniel",
  "bm_fable",
  "bm_george",
  "bm_lewis",
]
speed = 1.0
# Voice direction: slower for segments dense with numbers, faster for the
# closing recap; every change is shown in the session log.
adapt_pace = true
dense_numbers = 4.0  # numbers per 100 words that make a segment dense
dense_slowdown = 0.07  # dense segments at 7% below the speed
recap_speedup = 0.05  # the closing recap at 5% above it
device = "auto"  # auto, cpu, or cuda
repo_id = "hexgrad/Kokoro-82M"
sample_rate = 24000
sentence_pause_s = 0.35
segment_pause_s = 1.2
recall_pause_s = 6.0  # silence after a recall question
# Path to the espeak-ng program, for words Kokoro's lexicon lacks. It runs as
# a separate process. Empty: such words are skipped.
espeak_bin = ""
# Piper, the fallback engine (pip install piper-tts; GPL, run as a separate
# program). With engine = "piper", voice and second_voice name Piper voices,
# for example "en_US-lessac-medium", downloaded into piper_voices_dir with
# python -m piper.download_voices <voice> --data-dir <piper_voices_dir>.
piper_command = ["piper"]
piper_voices_dir = ""  # default: <model_dir>/piper
piper_timeout_s = 60.0  # per sentence
disclaimer = "This is an AI-generated audio session, written from your own study materials."

[audio]
ffmpeg_bin = "ffmpeg"
mp3_bitrate = "96k"

[concepts]
extract_on_session = true  # when a session first uses a material
batch_words = 4000  # material words per extraction call
candidates = 100  # existing concepts shown with each batch
max_per_material = 20
events_shown = 50  # event log entries in the web app

[elicit]
max_questions = 3  # before the Elicitor must propose a brief
outline_words = 80  # of each material, shown to the Elicitor
max_message_chars = 2000

[qa]
top_k = 6  # passages given to the Tutor per question
history_turns = 3  # earlier exchanges shown for follow-up questions
verify = true  # check answer sentences; failures are shown with a warning
max_question_chars = 1000

[quiz]
questions = 5  # asked for; the Verifier may drop some
options = 4

[suggest]
# Suggestions at session start, prefilled from your preferences and from what
# your past sessions show; nothing inferred is used without saying why.
infer = true  # learn brief defaults from past sessions
half_life_days = 30.0  # a session's weight halves this often
min_evidence = 3.0  # sessions' worth of weight before an inferred value counts fully
min_confidence = 0.6  # inferred values below this are shown but not used
weak_mastery = 0.6  # concepts with a lower share of right quiz answers are suggested for revision
weak_topics = 3  # concepts in one revision suggestion
max_suggestions = 4
length_step = 1.25  # "too short" or "too long" on a session scales its length by this when repeated
low_rating = 2  # a session rated this or lower is not suggested first again

[evaluation]
# Pass thresholds for `groundcast eval`, on the means over all runs.
min_detection_rate = 0.95
max_false_flag_rate = 0.08
hard_tag = "hard"  # seeded errors with this tag must also reach the next value
min_hard_detection_rate = 0.90
